name: Verify independent State distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Clean standalone installation
        run: npm ci --ignore-scripts
      - name: Typecheck, unit tests, production build
        run: npm run verify
      - name: Pack and verify unrelated consumer and SQLite CLI
        run: npm run verify:install
  portable-core-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Clean standalone Node 20 install
        run: npm ci --ignore-scripts
      - name: Compile portable State API
        run: npm run build
      - name: Exercise portable API without unsupported SQLite import
        run: node scripts/verify-node20-core.mjs
