name: Verify independent State distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean standalone installation
        run: npm ci --ignore-scripts
      - name: Typecheck, unit tests, production build
        run: npm run verify
      - name: Pack and verify unrelated consumer and SQLite CLI
        run: npm run verify:install
